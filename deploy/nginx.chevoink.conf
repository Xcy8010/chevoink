# HTTP：ACME 续期挑战直接放行，其余全部 301 跳转到 HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name chevoink.chevolink.com;

  # certbot 续期使用 http-01 挑战，必须放行该路径
  location /.well-known/acme-challenge/ {
    root /var/www/chevoink/current;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS 主站
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name chevoink.chevolink.com;

  ssl_certificate /etc/letsencrypt/live/chevoink.chevolink.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chevoink.chevolink.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/chevoink/current;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 带 hash 的构建产物可长期缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 入口 html 禁止缓存，保证每次部署后用户立即拿到新版本
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
