# HTTP：ACME 续期挑战直接放行，其余全部 301 跳转到 HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name chevoink.chevolink.com;

  # certbot 续期使用 http-01 挑战，必须放行该路径
  location /.well-known/acme-challenge/ {
    root /var/www/chevoink/current;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS 主站
server {
  # http2：多路复用并行拉取 js/css/图片，显著降低首屏串行等待
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name chevoink.chevolink.com;

  ssl_certificate /etc/letsencrypt/live/chevoink.chevolink.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chevoink.chevolink.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/chevoink/current;
  index index.html;

  # gzip：压缩文本类响应（http 块默认只压 text/html）
  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # 上传图片静态直服：绕过 Node 进程；文件名含随机 ID 内容不可变，30 天强缓存安全
  location /api/uploads/ {
    alias /opt/chevoink/shared/uploads/;
    add_header Cache-Control "public, max-age=2592000, immutable";
    # 存量图经迁移脚本生成 <原文件名>.webp，旧 URL 优先命中 WebP
    try_files $uri.webp $uri =404;
  }

  location /api/ {
    # 发帖多图 base64 上传需要更大的请求体限制
    client_max_body_size 40m;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # APK 安装包与版本清单：持久目录（部署不清空），供 APP 内更新提示下载
  location = /download/version.json {
    alias /var/www/chevoink/download/version.json;
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location /download/ {
    alias /var/www/chevoink/download/;
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 带 hash 的构建产物可长期缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 入口 html 禁止缓存，保证每次部署后用户立即拿到新版本
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
